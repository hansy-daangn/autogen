name: Enable GitHub Pages (deploy from branch)

on:
  push:
    branches: ["claude/new-session-aqqyl5"]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages site (legacy build from this branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          api() {
            curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          code=$(api "https://api.github.com/repos/$REPO/pages")
          if [ "$code" = "404" ]; then
            echo "Pages not enabled yet — creating site (legacy, branch=$BRANCH)"
            code=$(api -X POST "https://api.github.com/repos/$REPO/pages" \
              -d "{\"build_type\":\"legacy\",\"source\":{\"branch\":\"$BRANCH\",\"path\":\"/\"}}")
            cat /tmp/resp.json; echo
            [ "$code" = "201" ] || [ "$code" = "409" ] || { echo "create failed ($code)"; exit 1; }
          else
            echo "Pages already enabled — ensuring source is $BRANCH (legacy)"
            code=$(api -X PUT "https://api.github.com/repos/$REPO/pages" \
              -d "{\"build_type\":\"legacy\",\"source\":{\"branch\":\"$BRANCH\",\"path\":\"/\"}}")
            cat /tmp/resp.json; echo
            [ "$code" = "204" ] || { echo "update failed ($code)"; exit 1; }
          fi
          code=$(api "https://api.github.com/repos/$REPO/pages")
          cat /tmp/resp.json; echo
