name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/new-session-aqqyl5", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # No `environment:` block on purpose — the auto-created github-pages
    # environment has a branch policy pinned to `main`, which rejects this
    # branch at job scheduling when the environment is declared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
